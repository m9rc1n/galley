<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        width: 440px;
        height: 280px;
        margin: 0;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 42px;
        background: radial-gradient(130% 150% at 0% 0%, #26a522 0%, #15760f 52%, #0b4f09 100%);
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      svg {
        width: 74px;
        height: 74px;
        flex: none;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.28));
      }
      .word {
        font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
        font-size: 54px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      .tag {
        text-wrap: balance;
        max-width: 330px;
        margin-top: 20px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 20px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="row">{{ICON}}<div class="word">galley</div></div>
    <div class="tag">Read pull and merge requests like articles</div>
  </body>
</html>
