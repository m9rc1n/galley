<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        width: 1400px;
        height: 560px;
        margin: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        background: radial-gradient(120% 160% at 0% 0%, #26a522 0%, #15760f 50%, #0b4f09 100%);
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .copy {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 76px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 500px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      svg {
        width: 92px;
        height: 92px;
        flex: none;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.28));
      }
      .word {
        font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
        font-size: 74px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      .tag {
        text-wrap: balance;
        margin-top: 26px;
        color: rgba(255, 255, 255, 0.92);
        font-size: 30px;
        line-height: 1.3;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 30px 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 7px 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        font-size: 16px;
      }
      .shot {
        position: absolute;
        top: 64px;
        left: 640px;
        width: 900px;
        border-radius: 14px;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="row">{{ICON}}<div class="word">galley</div></div>
      <div class="tag">Read pull and merge requests like articles</div>
      <ul>
        <li>Typeset documents</li>
        <li>Changes marked in the text</li>
        <li>GitHub and GitLab</li>
      </ul>
    </div>
    <img class="shot" src="{{SHOT}}" alt="" />
  </body>
</html>
